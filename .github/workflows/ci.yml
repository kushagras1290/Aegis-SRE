name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy packages apps/api
      - run: pytest --cov=packages --cov=apps/api --cov-branch --cov-fail-under=80
      - run: python scripts/static_verify.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'pnpm'}
      - run: pnpm --dir apps/web install --no-frozen-lockfile
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
