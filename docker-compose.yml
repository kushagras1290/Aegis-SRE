services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-local
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4.0-alpine
    ports: ["6379:6379"]

  redpanda:
    image: redpandadata/redpanda:v26.2.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:19092
    ports: ["19092:19092", "9644:9644"]

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3.19
    ports: ["8123:8123", "9000:9000"]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports: ["6333:6333", "6334:6334"]

  temporal:
    image: temporalio/auto-setup:1.31.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aegis
      POSTGRES_PWD: aegis-local
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: aegis
      GF_SECURITY_ADMIN_PASSWORD: aegis-local
    ports: ["3001:3000"]

  opa:
    image: openpolicyagent/opa:1.17.0-rootless
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./infra/opa:/policies:ro
    ports: ["8181:8181"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: aegis-local-password
    ports: ["9001:9001", "9002:9000"]
