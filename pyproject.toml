[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["tests*", "infra*", "schemas*", "migrations*", "docs*"]
namespaces = true

[project]
name = "aegis-sre"
version = "0.1.0"
description = "AI-native incident detection, RCA and policy-gated remediation platform"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.128,<0.129",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.50,<3",
  "alembic>=1.17,<2",
  "networkx>=3.6,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.7,<2",
  "structlog>=25.4,<26",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.38,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
stream=["confluent-kafka>=2.11,<3"]
orchestration=["temporalio>=1.18,<2"]
retrieval=["qdrant-client>=1.15,<2", "sentence-transformers>=5,<6"]
ml=["scipy>=1.16,<2", "polars>=1.30,<2", "river>=0.22,<1", "ruptures>=1.1,<2", "pyod>=2,<3"]
dev=["pytest>=9,<10","pytest-cov>=7,<8","hypothesis>=6.140,<7","ruff>=0.13,<1","mypy>=1.18,<2"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
pythonpath=["."]

[tool.ruff]
line-length=100
target-version="py314"

[tool.ruff.lint]
select=["F","B","UP","RUF"]
ignore=["S101"]

[tool.mypy]
python_version="3.14"
strict=true
ignore_missing_imports=true
exclude=["tests", "migrations"]
